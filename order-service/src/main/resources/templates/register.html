<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        }
        .auth-card {
            max-width: 380px;
            width: 100%;
            margin: 0 auto;
        }
        .brand {
            font-weight: 700;
            color: #4f46e5;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="auth-card card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="brand fs-4">Order Processing System</div>
                <div class="text-muted small">Tạo tài khoản mới</div>
            </div>

            <div class="alert alert-danger py-2" th:if="${registerError}" th:text="${registerError}"></div>

            <form method="post" action="/register" th:object="${registerRequest}">
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <input type="text" th:field="*{username}"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           class="form-control">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           class="form-control">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           class="form-control">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
            </form>

            <div class="text-center mt-3 small">
                Đã có tài khoản? <a href="/login" class="link-primary">Đăng nhập</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
