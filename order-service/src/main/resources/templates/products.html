<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; }
        .product-card img { height: 180px; object-fit: cover; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('products')}"></div>

<div class="container py-4">
    <h4 class="mb-4">Danh sách sản phẩm</h4>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
        <div class="col" th:each="product : ${products.content}">
            <div class="card product-card h-100 shadow-sm border-0">
                <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" class="card-img-top" alt="product image">
                <div class="card-body">
                    <h6 class="card-title" th:text="${product.name}"></h6>
                    <p class="card-text text-primary fw-semibold"
                       th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ' + ${product.currency}"></p>
                </div>
            </div>
        </div>
    </div>

    <nav class="mt-4" th:if="${products.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!products.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/app/products(page=${products.number - 1})}">Trước</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${products.number + 1} + ' / ' + ${products.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${!products.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/app/products(page=${products.number + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
