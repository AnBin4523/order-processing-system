<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản trị đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8fafc; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="container py-4">
    <h4 class="mb-4">Tất cả đơn hàng</h4>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Khách hàng</th>
                    <th>Email</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders.content}">
                    <td th:text="${order.id}"></td>
                    <td th:text="${order.customerName}"></td>
                    <td th:text="${order.customerEmail}"></td>
                    <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ' + ${order.currency}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status.name() == 'CONFIRMED'} ? 'bg-success' :
                                              (${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                              (${order.status.name() == 'CANCELLED'} ? 'bg-secondary' : 'bg-danger'))"
                              th:text="${order.status}"></span>
                    </td>
                    <td>
                        <form method="post" th:action="@{/admin/orders/{id}/status(id=${order.id}, page=${orders.number})}" class="d-flex gap-1">
                            <select name="status" class="form-select form-select-sm">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == order.status}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-outline-primary">Cập nhật</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-4" th:if="${orders.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!orders.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number - 1})}">Trước</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${orders.number + 1} + ' / ' + ${orders.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${!orders.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
