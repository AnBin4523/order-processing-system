<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản trị sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8fafc; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="container py-4">
    <h4 class="mb-4">Quản trị sản phẩm</h4>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h6 class="card-title">Thêm sản phẩm mới</h6>
                    <form method="post" action="/admin/products">
                        <div class="mb-2">
                            <label class="form-label">Tên</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Giá</label>
                            <input type="number" step="0.01" name="price" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Đơn vị tiền tệ</label>
                            <input type="text" name="currency" class="form-control" value="VND" maxlength="3" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ảnh (URL, để trống sẽ tự sinh)</label>
                            <input type="text" name="imageUrl" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Tạo sản phẩm</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="row row-cols-2 row-cols-lg-3 g-3">
                <div class="col" th:each="product : ${products.content}">
                    <div class="card h-100 shadow-sm border-0">
                        <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" class="card-img-top" style="height:120px;object-fit:cover;" alt="product image">
                        <div class="card-body p-2">
                            <div class="small fw-semibold" th:text="${product.name}"></div>
                            <div class="small text-primary" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ' + ${product.currency}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <nav class="mt-4" th:if="${products.totalPages > 1}">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${!products.hasPrevious()} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/products(page=${products.number - 1})}">Trước</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="${products.number + 1} + ' / ' + ${products.totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${!products.hasNext()} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/products(page=${products.number + 1})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
