<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8fafc; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('orders')}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Đơn hàng của tôi</h4>
        <a href="/app/orders/new" class="btn btn-primary btn-sm">+ Tạo đơn hàng mới</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Trạng thái</th>
                    <th>Tổng tiền</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders.content}">
                    <td th:text="${order.id}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status.name() == 'CONFIRMED'} ? 'bg-success' :
                                              (${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                              (${order.status.name() == 'CANCELLED'} ? 'bg-secondary' : 'bg-danger'))"
                              th:text="${order.status}"></span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ' + ${order.currency}"></td>
                    <td>
                        <form th:if="${order.status.name() == 'PENDING'}"
                              method="post" th:action="@{/app/orders/{id}/cancel(id=${order.id}, page=${orders.number})}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Hủy</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-4" th:if="${orders.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!orders.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/app/orders(page=${orders.number - 1})}">Trước</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${orders.number + 1} + ' / ' + ${orders.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${!orders.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/app/orders(page=${orders.number + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
