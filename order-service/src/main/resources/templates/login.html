<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        }
        .auth-card {
            max-width: 380px;
            width: 100%;
            margin: 0 auto;
        }
        .brand {
            font-weight: 700;
            color: #4f46e5;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="auth-card card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="brand fs-4">Order Processing System</div>
                <div class="text-muted small">Đăng nhập để tiếp tục</div>
            </div>

            <div class="alert alert-danger py-2" th:if="${param.error}">Sai tên đăng nhập hoặc mật khẩu.</div>
            <div class="alert alert-success py-2" th:if="${param.registered}">Đăng ký thành công, hãy đăng nhập.</div>
            <div class="alert alert-success py-2" th:if="${param.logout}">Bạn đã đăng xuất.</div>

            <form method="post" action="/login">
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            </form>

            <div class="text-center mt-3 small">
                Chưa có tài khoản? <a href="/register" class="link-primary">Đăng ký</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
