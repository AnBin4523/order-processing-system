<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8fafc; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('orders')}"></div>

<div class="container py-4">
    <h4 class="mb-4">Tạo đơn hàng mới</h4>

    <div class="card shadow-sm border-0" style="max-width: 480px;">
        <div class="card-body p-4">
            <form method="post" action="/app/orders/new">
                <div class="mb-3">
                    <label class="form-label">Sản phẩm</label>
                    <select name="productId" class="form-select" required>
                        <option th:each="product : ${products}" th:value="${product.id}"
                                th:text="${product.name} + ' - ' + ${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ' + ${product.currency}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Số lượng</label>
                    <input type="number" name="quantity" class="form-control" min="1" value="1" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đặt hàng</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
